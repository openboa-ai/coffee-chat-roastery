name: Roastery quality

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  quality:
    name: Roastery deterministic quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Run deterministic tests
        run: npm test
      - name: Verify CI and migration policy
        run: npm run ci:policy

  aggregate:
    name: Roastery required
    if: always()
    needs:
      - quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Interpret required lane state
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          case "$QUALITY_RESULT" in
            success)
              printf '%s\n' 'quality=succeeded'
              ;;
            failure)
              printf '%s\n' 'quality=failed' >&2
              exit 1
              ;;
            skipped)
              printf '%s\n' 'quality=skipped' >&2
              exit 1
              ;;
            cancelled)
              printf '%s\n' 'quality=unavailable' >&2
              exit 1
              ;;
            *)
              printf '%s\n' 'quality=invalid' >&2
              exit 1
              ;;
          esac
