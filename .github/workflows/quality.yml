name: Roastery quality

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  merge_group:

permissions: {}

jobs:
  eligibility:
    name: Roastery author eligibility
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Admit merge queue candidate
        if: github.event_name == 'merge_group'
        run: printf '%s\n' 'author=admitted_merge_queue_candidate'
      - name: Verify trusted pull request author
        if: github.event_name == 'pull_request'
        env:
          AUTHOR_ASSOCIATION:
            ${{ github.event.pull_request.author_association }}
        run: |
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER)
              printf '%s\n' 'author=trusted_member'
              ;;
            *)
              printf '%s\n' 'author=untrusted' >&2
              exit 1
              ;;
          esac

  quality:
    name: Roastery deterministic quality
    needs: eligibility
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Run deterministic tests
        run: npm test
      - name: Verify CI and migration policy
        run: npm run ci:policy

  publication:
    name: Roastery publication contract
    needs: eligibility
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run publication acceptance
        run: npm run test:publication
      - name: Enforce publication against the checked-out event head
        env:
          ROASTERY_TRUSTED_CONTRACT_REPOSITORY:
            ${{ vars.ROASTERY_TRUSTED_CONTRACT_REPOSITORY }}
          ROASTERY_TRUSTED_CONTRACT_COMMIT:
            ${{ vars.ROASTERY_TRUSTED_CONTRACT_COMMIT }}
          ROASTERY_TRUSTED_CONTRACT_DIGEST:
            ${{ vars.ROASTERY_TRUSTED_CONTRACT_DIGEST }}
        run: npm run check:publication

  contract-refresh:
    name: Roastery contract refresh
    needs: eligibility
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare immutable receipt location
        run: mkdir -p artifacts
      - name: Run protected contract-refresh acceptance
        env:
          CONTRACT_REFRESH_EVIDENCE_OUTPUT: artifacts/contract-refresh-evidence.json
        run: npm run test:contract-refresh
      - name: Preserve contract-refresh evidence
        id: upload-contract-refresh-evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contract-refresh-evidence
          path: artifacts/contract-refresh-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Bind evidence upload outputs into final receipt
        env:
          CONTRACT_REFRESH_EVIDENCE_ARTIFACT_DIGEST:
            ${{ steps.upload-contract-refresh-evidence.outputs.artifact-digest
            }}
          CONTRACT_REFRESH_EVIDENCE_ARTIFACT_ID:
            ${{ steps.upload-contract-refresh-evidence.outputs.artifact-id }}
          CONTRACT_REFRESH_EVIDENCE_ARTIFACT_URL:
            ${{ steps.upload-contract-refresh-evidence.outputs.artifact-url }}
          CONTRACT_REFRESH_EVIDENCE_PATH: artifacts/contract-refresh-evidence.json
          CONTRACT_REFRESH_RECEIPT_OUTPUT: artifacts/contract-refresh-receipt.json
          GITHUB_RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: npm run build:contract-refresh-receipt
      - name: Preserve artifact-bound contract-refresh receipt
        id: upload-contract-refresh-receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contract-refresh-receipt
          path: artifacts/contract-refresh-receipt.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Roastery required
    if: always()
    needs:
      - eligibility
      - quality
      - publication
      - contract-refresh
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Interpret required lane state
        env:
          CONTRACT_REFRESH_RESULT: ${{ needs.contract-refresh.result }}
          ELIGIBILITY_RESULT: ${{ needs.eligibility.result }}
          PUBLICATION_RESULT: ${{ needs.publication.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          for lane in \
            "eligibility:$ELIGIBILITY_RESULT" \
            "quality:$QUALITY_RESULT" \
            "publication:$PUBLICATION_RESULT" \
            "contract-refresh:$CONTRACT_REFRESH_RESULT"
          do
            name=${lane%%:*}
            result=${lane#*:}
            case "$result" in
              success)
                printf '%s=%s\n' "$name" 'succeeded'
                ;;
              failure)
                printf '%s=%s\n' "$name" 'failed' >&2
                exit 1
                ;;
              skipped)
                printf '%s=%s\n' "$name" 'skipped' >&2
                exit 1
                ;;
              cancelled)
                printf '%s=%s\n' "$name" 'unavailable' >&2
                exit 1
                ;;
              *)
                printf '%s=%s\n' "$name" 'invalid' >&2
                exit 1
                ;;
            esac
          done
