name: Roastery quality

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  merge_group:

permissions: {}

jobs:
  eligibility:
    name: Roastery author eligibility
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Decide author eligibility
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTHOR_ASSOCIATION:
            ${{ github.event.pull_request.author_association }}
        run: |
          case "$EVENT_NAME" in
            merge_group)
              printf '%s\n' 'author=admitted_merge_queue_candidate'
              ;;
            pull_request)
              case "$AUTHOR_ASSOCIATION" in
                OWNER|MEMBER)
                  printf '%s\n' 'author=trusted_member'
                  ;;
                *)
                  printf '%s\n' 'author=untrusted' >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              printf '%s\n' 'author=invalid_event' >&2
              exit 1
              ;;
          esac

  quality:
    name: Roastery deterministic quality
    needs: eligibility
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Verify package and canonical bundle closure
        run: npm run package:check
      - name: Run deterministic tests with TypeScript coverage
        run: npm run test:coverage
      - name: Retain coverage for the native code-quality rule
        if:
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: roastery-typescript-coverage
          path: coverage/cobertura-coverage.xml
          if-no-files-found: error
          retention-days: 1
      - name: Verify CI policy
        run: npm run ci:policy

  upload-coverage:
    name: Upload Roastery TypeScript coverage
    needs: quality
    if:
      ${{ !cancelled() && needs.quality.result == 'success' && github.event_name
      != 'merge_group' && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: roastery-typescript-coverage
      - name: Upload coverage to GitHub code quality
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1
        with:
          file: cobertura-coverage.xml
          language: JavaScript
          label: roastery-typescript

  publication:
    name: Roastery publication contract
    needs: eligibility
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run publication acceptance
        run: npm run test:publication
      - name: Enforce publication against the checked-out event head
        env:
          ROASTERY_TRUSTED_CONTRACT_REPOSITORY:
            ${{ vars.ROASTERY_TRUSTED_CONTRACT_REPOSITORY }}
          ROASTERY_TRUSTED_CONTRACT_COMMIT:
            ${{ vars.ROASTERY_TRUSTED_CONTRACT_COMMIT }}
          ROASTERY_TRUSTED_CONTRACT_DIGEST:
            ${{ vars.ROASTERY_TRUSTED_CONTRACT_DIGEST }}
        run: npm run check:publication

  aggregate:
    name: Roastery required
    if: always()
    needs:
      - eligibility
      - quality
      - publication
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Interpret required lane state
        env:
          ELIGIBILITY_RESULT: ${{ needs.eligibility.result }}
          PUBLICATION_RESULT: ${{ needs.publication.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          decision=0
          for lane in \
            "eligibility:$ELIGIBILITY_RESULT" \
            "quality:$QUALITY_RESULT" \
            "publication:$PUBLICATION_RESULT"
          do
            name=${lane%%:*}
            result=${lane#*:}
            case "$result" in
              success)
                printf '%s=%s\n' "$name" 'succeeded'
                ;;
              failure)
                printf '%s=%s\n' "$name" 'failed' >&2
                decision=1
                ;;
              skipped)
                printf '%s=%s\n' "$name" 'skipped' >&2
                decision=1
                ;;
              cancelled)
                printf '%s=%s\n' "$name" 'unavailable' >&2
                decision=1
                ;;
              *)
                printf '%s=%s\n' "$name" 'invalid' >&2
                decision=1
                ;;
            esac
          done
          exit "$decision"
