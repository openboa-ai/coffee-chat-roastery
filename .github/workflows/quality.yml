name: Roastery quality

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  eligibility:
    name: Roastery author eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Decide author eligibility
        env:
          AUTHOR_ASSOCIATION:
            ${{ github.event.pull_request.author_association }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            merge_group) exit 0 ;;
            pull_request)
              case "$AUTHOR_ASSOCIATION" in OWNER|MEMBER) exit 0 ;; *) exit 1 ;; esac
              ;;
            *) exit 1 ;;
          esac

  quality:
    name: Roastery deterministic quality
    needs: eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install immutable Gitleaks
        run: .github/scripts/install-gitleaks.sh
      - name: Scan complete Git history
        run: |
          test ! -e .gitleaks.toml
          test ! -e .gitleaksignore
          gitleaks git --config "$GITLEAKS_TRUSTED_CONFIG" \
            --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow \
            --redact --no-banner .
          gitleaks dir --config "$GITLEAKS_TRUSTED_CONFIG" \
            --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow \
            --redact --no-banner .
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run repository:check
      - run: npm run smoke
      - run: npm run package:check
      - run: npm run ci:policy

  aggregate:
    name: Roastery required
    if: always()
    needs:
      - eligibility
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require every applicable lane
        env:
          ELIGIBILITY_RESULT: ${{ needs.eligibility.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          test "$ELIGIBILITY_RESULT" = success
          test "$QUALITY_RESULT" = success
